[project]
name = "encore-mc-agent"
version = "0.1.0"
description = "Encore MC: writes the title cards during a set, the debrief after it and the green-room answers, in character, from measured facts only. A Strands agent on Amazon Bedrock with Amazon Polly's voice, packaged for Amazon Bedrock AgentCore Runtime; when the model cannot answer, the MC stays silent and says why (no rule-based lines)."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "bedrock-agentcore>=1.24.0",
  "boto3>=1.43.0",
  "botocore[crt]>=1.43.108",
  "strands-agents[openai]>=1.58.0",
]

[dependency-groups]
dev = ["pytest>=9.1.0"]
# Optional: the CPU humour model for the stand-up judge (src/mc_agent/humor.py, off unless MC_HUMOR_MODEL_DIR is set).
humor = ["numpy>=1.26", "onnxruntime>=1.20", "tokenizers>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# bedrock_agentcore still uses a class-based pydantic config; not ours to fix.
filterwarnings = [
  "ignore::pydantic.warnings.PydanticDeprecatedSince20",
  # bedrock_agentcore's log formatter calls datetime.utcnow() (Python 3.12 deprecation).
  "ignore:datetime.datetime.utcnow:DeprecationWarning:bedrock_agentcore",
]
