<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="world.css">
<style>
  /* Theatre · poetry / spoken word · the wide shot, the house holding its breath; snaps, not laughs */
  .shot img { filter: saturate(.85) contrast(1.05) brightness(.95); }
  .shot .grade { background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(255,215,154,.14), rgba(0,0,0,0) 60%), linear-gradient(180deg, rgba(7,6,10,.25) 0%, rgba(7,6,10,0) 35%, rgba(7,6,10,0) 60%, rgba(7,6,10,.6) 100%); }
  .held { position: absolute; left: 90px; top: 54px; font-family: var(--display); font-weight: 600; font-size: 28px; letter-spacing: .14em; color: var(--gold-dim); text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  .held b { color: var(--paper); font-weight: 700; }
  .snaps { position: absolute; right: 90px; bottom: 150px; text-align: right; font-family: var(--display); font-weight: 500; font-size: 34px; letter-spacing: .1em; color: var(--gold); text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  .snaps small { display: block; font-family: var(--text); font-size: 22px; letter-spacing: 0; color: var(--gold-dim); margin-top: 6px; }
</style></head>
<body><div class="tv">
  <div class="shot"><img src="photos/poetry-wide.jpg" alt="Seated theatre audience listening under stage light"><div class="grade"></div><div class="vignette"></div><div class="grain"></div></div>
  <div class="held">WIDE · HELD 14 s · <b>the house is listening</b></div>
  <div class="live"><i></i>LIVE <small>mic on · Riya's phone</small></div>
  <div class="snaps">snaps on the last line<small>cadence steady · 2.1 s pause before it, held on purpose</small></div>
  <div class="lower-third">
    <div class="venue">Prithvi · <em>Theatre</em></div>
    <div class="rule"></div>
    <div class="clock">1:48 <small>of a 3:00 slot · poem 2 of 3</small></div>
  </div>
  <div class="hints"><span><b>OK</b>end slot</span><span><b>Back</b>stop</span></div>
</div></body></html>
